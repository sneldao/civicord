specVersion: 1.0.0
repository: https://github.com/sneldao/civicord
description: Longitudinal tracker of UK candidate/MP websites — ENSv2 subnames (p{person_id}.civicord.eth) as a tamper-evident public record of website liveness and change.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: UserRegistry
    network: sepolia
    source:
      address: "0x097bdb198cb1a40cbd0c05ff801efe83bb151428"
      abi: UserRegistry
      startBlock: 11696000
    mapping:
      kind: ethereum
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Candidate
        - NodeToCandidate
        - Stat
      abis:
        - name: UserRegistry
          file: ./abis/UserRegistry.json
      eventHandlers:
        - event: LabelRegistered(indexed uint256,indexed bytes32,string,address,uint64,indexed address)
          handler: handleLabelRegistered
        - event: LabelUnregistered(indexed uint256,indexed address)
          handler: handleLabelUnregistered
        - event: ResolverUpdated(indexed uint256,indexed address,indexed address)
          handler: handleResolverUpdated
  - kind: ethereum
    name: PermissionedResolver
    network: sepolia
    source:
      address: "0xa90747f2d95a9c4d0cad151669a9af31a3cad630"
      abi: PermissionedResolver
      startBlock: 11696000
    mapping:
      kind: ethereum
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Candidate
        - NodeToCandidate
        - RecordToCandidate
        - TextRecord
        - TextRecordChange
        - Stat
      abis:
        - name: PermissionedResolver
          file: ./abis/PermissionedResolver.json
      eventHandlers:
        - event: Linked(indexed uint256,indexed bytes32,bytes)
          handler: handleLinked
        - event: TextUpdated(indexed uint256,indexed string,string,string)
          handler: handleTextUpdated
