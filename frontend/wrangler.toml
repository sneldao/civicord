name = "civicord"
account_id = "e7383c0c7474c8f61cc06598eeb134a0"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# R2 bucket holding pipeline data snapshots (candidates.json etc.), served at
# /data/* by public/_worker.js. account_id is pinned so `wrangler pages deploy`
# targets the right account. NOTE: `wrangler r2 object put` ignores this pin and
# writes to the wrong account — upload snapshots with scripts/upload_snapshot.sh
# instead (see docs/ops.md).
[[r2_buckets]]
binding = "DATA"
bucket_name = "civicord-data"
