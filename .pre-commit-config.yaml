# Secrets scanning: blocks any commit containing detected credentials
repos:
  # Secret detection — runs on commit and blocks on finding
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/src/data/candidates\.json$
      - id: end-of-file-fixer
        exclude: ^frontend/src/data/candidates\.json$
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/src/data/candidates\.json$
      - id: check-added-large-files
        args: ["--maxkb=512"]
        exclude: |
          ^frontend/src/data/candidates\.json$
          ^frontend/src/data/constituencies\.json$
          ^frontend/src/data/hexes\.json$
          ^frontend/src/data/constituency-index\.json$
      - id: check-merge-conflict
      - id: detect-private-key

  # Python linting (project language)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
