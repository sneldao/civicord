[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civicord"
version = "0.1.0"
description = "Longitudinal tracker of UK political candidate and representative websites"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Civicord contributors" }]
dependencies = ["httpx>=0.27"]

[project.scripts]
civicord = "civicord.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
