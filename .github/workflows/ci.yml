name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      # The build resolves data from pipeline CSVs → R2 snapshot → committed
      # JSON; CI has no CSVs, so the committed snapshot is the source of truth.
      - name: Astro check
        run: npx astro check
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Link + artifact check
        run: node scripts/check-links.mjs
        working-directory: frontend
      # Smoke test: fetch-based, no browser needed (see frontend/scripts/smoke.mjs).
      # Polls for preview readiness instead of a fixed sleep (avoids CI flakes).
      - name: Smoke test (preview server)
        run: |
          npx astro preview --port 4321 &> /tmp/preview.log &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4321/; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs http://localhost:4321
        working-directory: frontend
