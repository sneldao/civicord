name: Refresh

# The continuity loop (docs/cadence.md): monthly liveness audit, quarterly
# body re-crawl + claim diff. Snapshot changes arrive as a pull request for
# human review — never direct to main. Pages deploy stays manual (docs/ops.md).

on:
  schedule:
    - cron: "0 6 1 * *" # monthly audit, 06:00 UTC on the 1st
  workflow_dispatch:
    inputs:
      full:
        description: "Quarterly pass: recrawl bodies + claim diff (default: audit only)"
        required: false
        default: "false"
        type: boolean

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_RESIDENTIAL_PROXY: ${{ secrets.CIVICORD_PROXY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pipeline
        run: pip install -e .

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Download + ingest baseline roster
        run: civicord download --full --large-json && civicord ingest

      # Two-stage vantage (docs/cadence.md): stage 1 runs from the CI network —
      # cheap but 403/429-prone — so CIVICORD_PROXY is deliberately NOT set here.
      - name: Monthly audit (CI vantage)
        run: civicord audit --content-check

      # Stage 2 re-checks only inconclusive_blocked rows through the residential
      # proxy and merges them back into audit_liveness.csv. Skipped when the
      # secret is unset (secrets can't gate `if:` directly — HAS_RESIDENTIAL_PROXY
      # mirrors it at job level).
      - name: Re-check blocked rows (residential vantage)
        if: env.HAS_RESIDENTIAL_PROXY != ''
        env:
          CIVICORD_PROXY: ${{ secrets.CIVICORD_PROXY }}
        run: civicord audit --status inconclusive_blocked --content-check

      - name: Change signals + report
        run: civicord changes && civicord report

      - name: Quarterly re-crawl + claim diff
        if: inputs.full == 'true'
        run: civicord recrawl && civicord claimdiff

      - name: Rebuild frontend snapshots
        run: |
          mkdir -p data/boundaries
          curl -fsSL -o data/boundaries/ak-v5.geojson \
            https://automaticknowledge.org/wpc-hex/uk-wpc-hex-constitcode-v5-june-2024.geojson
          node frontend/scripts/build-data.mjs
          node frontend/scripts/build-map.mjs
          node frontend/scripts/build-search.mjs

      - name: Open snapshot refresh PR
        run: |
          git config user.name "civicord-refresh"
          git config user.email "civicord-refresh@users.noreply.github.com"
          # data/out + map outputs are gitignored by policy (see .gitignore);
          # the committable snapshot is frontend/src/data (candidates.json etc.).
          git add frontend/src/data
          if git diff --cached --quiet; then
            echo "No snapshot changes — nothing to propose."
            exit 0
          fi
          BRANCH="refresh/$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git commit -m "Scheduled snapshot refresh ($(date -u +%Y-%m-%d))"
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create --title "Snapshot refresh $(date -u +%Y-%m-%d)" \
            --body "Automated refresh (monthly audit$([ "${{ inputs.full }}" = "true" ] && echo " + quarterly recrawl/claimdiff")). Review counts, then merge + deploy per docs/ops.md."
        env:
          GH_TOKEN: ${{ github.token }}
